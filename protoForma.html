<script>
/* ============================================================================
   FORMA - PROTOTIPO FINAL - NOTAS PARA DESARROLLO
   ============================================================================
   Este archivo es un prototipo navegable (HTML + JS sin dependencias). Todo vive
   en memoria: al recargar vuelve al estado inicial. Los comentarios "REGLA:"
   repartidos por el codigo marcan las reglas de negocio acordadas.

   0. QUE ES SIMULADO EN EL PROTOTIPO (NO COPIAR A PRODUCCION)
   - Fecha actual fija: sabado 14 nov 2026 (TD / TODAY). Usar la fecha real.
   - Historial de entrenamientos, series de semanas anteriores y datos de la
     grafica por ejercicio (funciones sessions, exPast, bw): son SIMULADOS.
     En produccion: guardar cada serie confirmada (cliente, ejercicio, fecha,
     kg, reps, quien la registro, marca de tiempo) y derivar de ahi las semanas
     anteriores, la grafica y los estados Entrenado / No entrenado.
   - Estados del calendario (Entrenado / No entrenado) de semanas pasadas y la
     adherencia semanal usan datos de ejemplo (campo c.done).
   - Pagos, vencimientos y notificaciones de vencimiento son datos sembrados;
     en produccion los genera un proceso programado.
   - Login con accesos de demostracion; no hay autenticacion real.
   - Clientes de entrenadores 2 y 3 son parciales (campo x = clientes no cargados).

   1. ROLES Y PERMISOS
   - Superadmin: crea, edita, suspende y reactiva entrenadores (limite de
     clientes opcional); ve el detalle de entrenadores y clientes (solo
     informativo); asigna y reasigna clientes; administra la biblioteca de
     ejercicios (puede editar y eliminar cualquier ejercicio).
   - Entrenador: administra SOLO sus clientes. Crea clientes (con valoracion
     inicial), rutinas, nutricion, horarios, pagos y valoraciones; aplaza y
     cancela entrenamientos (sin aprobacion); aprueba o rechaza aplazamientos
     solicitados por el cliente; crea ejercicios propios.
   - Cliente: ve su informacion; registra entrenamiento (solo el dia actual),
     valoraciones, horario real si no tiene horario asignado; solicita aplazar y
     cancela entrenamientos.
   - Entrenador suspendido: conserva su detalle y puede reactivarse; no se le
     pueden asignar clientes; sus clientes pierden acceso mientras dure.
   - Acceso: se crea con enlace de invitacion (el usuario define su contrasena).
     Primer ingreso: cambio de contrasena con validacion en vivo + aceptacion de
     terminos y tratamiento de datos de salud. Falta pantalla de recuperacion.

   2. REASIGNACION DE CLIENTES (doRe / askRe)
   - Al cambiar de entrenador se guarda una "foto" del registro (WK) del
     entrenador anterior. Si el cliente vuelve a un entrenador con el que ya
     estuvo, el superadmin elige: RETOMAR (recupera rutina, progreso, pagos y
     nutricion; el conteo de semanas continua desde la semana en que se fue) o
     EMPEZAR DE NUEVO (registro vacio, semana 1; el anterior se archiva).
   - Con un entrenador nuevo siempre es registro nuevo, semana 1.
   - Respeta el limite de clientes del entrenador destino.
   - Notifica al cliente, al nuevo entrenador y al superadmin.
   - Modelo sugerido: entidad "Vinculo cliente-entrenador" con fecha inicio/fin,
     estado y todos los datos colgando del vinculo.

   3. BIBLIOTECA DE EJERCICIOS
   - Compartida: todos los ejercicios son visibles para todos, sin importar
     quien los creo (campo by). Entrenador edita/elimina solo los suyos; el
     superadmin cualquiera. No hay "duplicar y editar".
   - Sin duplicados: al escribir el nombre, el sistema busca coincidencias
     (ignora tildes, mayusculas y plurales; funciones sim / dupMatches / dupChk).
     Nivel 1.0 = ya existe (bloquea guardar); >= 0.8 = muy parecido (advierte);
     >= 0.5 = relacionado. "Usar este" lleva al ejercicio o lo agrega al dia.
     Validar tambien en servidor. Pendiente: decidir si el equipo hace parte de
     la identidad del ejercicio.
   - Tipo de medida por ejercicio: repeticiones o tiempo (segundos).

   4. RUTINA (EDITOR)
   - Dias configurables: agregar, quitar (no se puede quitar uno con
     entrenamiento registrado), reordenar ejercicios (arrastrar + flechas).
   - Nombre del dia automatico segun grupos musculares en el orden elegido
     ("Dia 1 - Espalda y pecho"); si el entrenador lo edita deja de ser
     automatico; si lo borra vuelve a serlo (genName).
   - Por ejercicio: series, repeticiones o segundos, descanso, nota.
   - Plantillas de rutina y nutricion: guardar, aplicar (reemplaza el editor,
     no guarda hasta confirmar), eliminar. Falta renombrar.
   - Aviso de cambios sin guardar al salir (modal + beforeunload).

   5. HORARIO DEL ENTRENAMIENTO
   - Cada dia de rutina puede tener dia de la semana + hora inicio + hora fin
     (opcional). El switch "Horario asignado" vive en el editor de rutina.
   - Con horario asignado: lo define el entrenador, lo ve el cliente, alimenta la
     agenda. Sin horario asignado: el cliente registra fecha, inicio y fin de
     cada entrenamiento y el entrenador lo ve (en la rutina y en su agenda).
   - NUNCA se muestra ni se guarda si el cliente es "virtual"; solo se sabe si
     tiene horario o no (chips "Con horario" / "Sin horario").
   - Fin siempre posterior al inicio. Los horarios se conservan al apagar el
     switch y al aplicar plantillas.

   6. AGENDA DEL ENTRENADOR (pantalla de inicio)
   - Calendario del mes (una fila por semana, contador de sesiones por dia) y
     detalle de la semana seleccionada con scroll interno; solo muestra dias con
     sesiones. Boton "Hoy": va al mes/semana actual y hace scroll al dia de hoy.
     Tocar un dia hace scroll a su detalle. Barra con acceso a "Mis clientes".
   - Convencion general: SIN scroll infinito. Listas largas = paginadas (5-6
     por pagina) o con contenedor de altura limitada; secciones largas =
     desplegables (details) y su estado abierto/cerrado se recuerda. NO quitar.

   7. REGISTRO DE ENTRENAMIENTO (rutina semanal)
   - Navegacion por flechas entre semanas; la semana se calcula desde la fecha de
     inicio del vinculo (semana N de entrenamiento). No hay semana < 1.
   - Semana actual: solo se registra el entrenamiento del DIA ACTUAL. Antes hay
     que marcar "Hoy si entrene" / "Marcar entrenamiento realizado" (confirma,
     guarda quien y cuando, NO se puede deshacer). Solo entonces se ven los
     campos de kg y reps. Cada serie se confirma con la marca; confirmada queda
     bloqueada (no se edita ni se desmarca). Otros dias de la semana: consulta.
   - Semanas anteriores: solo consulta, con detalle de cada ejercicio ejecutado
     de los dias completados. Semanas siguientes: solo consulta (metas).
   - Todos los bloques de dia son desplegables. Comentario del dia (cliente ->
     entrenador). Ultima vez por ejercicio.
   - Estados del dia: Pendiente / En progreso / Completado. Un dia que termina sin
     registro queda "No entrenado" (rojo).

   8. APLAZAR / MOVER / CANCELAR ENTRENAMIENTO (planOf, ppOpen, ppSave, ppRes)
   - Solo sobre dias PROGRAMADOS que aun no llegan y no estan entrenados ni
     cancelados. Un dia ya entrenado o no entrenado NO se puede aplazar ni
     cancelar. Nunca se mueve hacia atras (destinos: hoy en adelante).
   - Dos modos: (a) MOVER BLOQUE: ese dia y los siguientes de la semana se corren
     k dias (k = 1; el dia mover puede empujar a la semana siguiente); (b) MOVER
     SOLO ESTE ENTRENAMIENTO: elegir otro dia (con rutina o libre) y, opcional,
     nueva hora; mismo dia + otra hora = "mover entrenamiento".
   - Cliente: crea SOLICITUD pendiente que el entrenador aprueba o rechaza. Si
     rechaza o no responde y el dia termina sin entrenar, queda como no
     entrenado y nada cambia. Entrenador: aplica directo y notifica al cliente.
   - Aprobado: el dia original queda sin rutina pero conserva en el detalle que
     fue aplazado; la rutina aparece en el nuevo dia ("Movido desde el X").
   - Aplica solo al periodo actual del plan: al renovar vuelve al horario base.
   - Cancelar: sin aprobacion; el dia queda como no entrenado con comentario
     "cancelado por X, fecha, motivo" visible en el detalle.
   - Trazabilidad: historial desplegable y paginado de aplazamientos y
     cancelaciones (quien, cuando, motivo, resolucion).
   - Calendario: entrenado verde, no entrenado rojo, aplazado borde naranja
     (solicitado = borde naranja punteado), programado punteado, hoy borde blanco.
   - Pendiente por decidir: limite del bloque a la misma semana; dias hacia
     atras; si la cancelacion del cliente tambien requiere aprobacion.

   9. PROGRESO Y VALORACIONES
   - Valoracion = peso (obligatorio) + % grasa, cuello, hombros, pecho, cintura,
     abdomen, cadera, brazo, muslo, pantorrilla (opcionales) (lista MET). Estatura
     se captura al crear el cliente (aun no se muestra). La valoracion inicial se
     toma al crear el cliente.
   - Grafica de linea por medida (selector de medida) + ultima valoracion en
     etiquetas + historial desplegable y paginado. Lo registran cliente o
     entrenador y el otro recibe notificacion.
   - Grafica de barras por ejercicio: barra de peso y de repeticiones juntas por
     dia de entrenamiento; selector de ejercicio (radios, a la derecha) y de
     periodo (30 dias, 3 meses, 6 meses, 1 ano); scroll horizontal. Cada barra se
     normaliza a su propio maximo. Ejercicios por tiempo muestran solo segundos.
   - Pendiente: lista de medidas configurable por entrenador; mejorar el modulo.

   10. NUTRICION
   - Por cliente: metas diarias (kcal, proteina, carbos, grasas), comidas con
     hora, alimentos con cantidad libre, recomendaciones, plantillas. El cliente
     solo lee. Guardado automatico. Aviso: metas orientativas que no sustituyen la
     asesoria de un profesional de la salud. Sin base de alimentos ni calculo de
     macros (fuera de alcance v1).

   11. PAGOS
   - Entrenador registra pagos del servicio (monto, fecha, vencimiento);
     estados: Al dia / Vence pronto / Vencido / Sin pago. Filtro rapido de pago
     pendiente. Cliente ve solo aviso de vencimiento. Registro manual en v1.

   12. NOTIFICACIONES (notify, campana en el encabezado)
   - Por rol, con contador y lista; cada una redirige al detalle (cid/tab/day).
   - Eventos: rutina asignada o actualizada; horario asignado o cambiado;
     entrenamiento registrado (la otra parte); valoracion registrada (la otra
     parte); pago realizado; vencimiento de plan / pago vencido; solicitud de
     aplazamiento (a entrenador); aprobacion / rechazo / aplazamiento directo /
     cancelacion (a la otra parte); comentario del cliente en un dia; cliente
     reasignado (cliente, nuevo entrenador, superadmin).
   - Pendientes: notificar cambios de nutricion; email/push.

   13. NAVEGACION Y UX
   - Superadmin: Panel con secciones clickeables (clientes con selector Sin
     registrar / Mas recientes / Mas antiguos, entrenadores, atencion, biblioteca),
     migas de pan clickeables, logo vuelve al inicio, lista de clientes en tabla
     con busqueda, filtros por entrenador y pago, orden por columna y paginacion.
   - Entrenador: Agenda -> Mis clientes (con columna Horario) -> detalle con
     pestañas Resumen (incluye calendario del mes e historial), Rutina (solo
     semanas), Progreso, Nutricion, Pagos, Perfil.
   - Cliente: movil primero; Rutina (semana / mes), Progreso, Nutricion.
   - Accesibilidad: etiquetas en botones de icono, foco visible, filas clickeables
     con teclado, colores no son el unico indicador, modo oscuro automatico.

   14. MODELO DE DATOS SUGERIDO
   Usuario(rol) | Entrenador(limite, estado) | Cliente | Vinculo(cliente,
   entrenador, inicio, fin) | Ejercicio(grupo, equipo, tipo medida, creador) |
   Rutina -> DiaRutina(dia semana, hora inicio/fin) -> EjercicioRutina(series, reps,
   descanso, nota) | Entrenamiento(fecha, dia, marcado por/cuando) |
   SerieRegistrada(kg, reps, por, cuando; inmutable) | Aplazamiento(modo, desde,
   hasta, k, hora, motivo, estado, solicitado por, resuelto por) | Cancelacion |
   Valoracion(medidas) | PlanNutricional | Pago | Notificacion | Plantilla.

   15. DECISIONES ABIERTAS
   Reglas de renovacion de plan; limite del bloque de aplazamiento; aprobacion de
   cancelaciones; equipo como parte de la identidad del ejercicio; medidas
   configurables; datos de emergencia; recuperacion de contrasena; que ve el
   cliente de pagos; politica de datos de salud (consentimiento ya incluido).
   ============================================================================ */

function openEd(){const r=JSON.parse(JSON.stringify(cur().routine));r.forEach((d,i)=>{d.g=[...new Set(d.ex.map(e=>(D.lib.find(x=>x.n===e.n)||{}).g).filter(Boolean))];d.auto=d.n===genName(d,i)});S.ed={day:0,r,q:'',base:JSON.stringify(r)};R()}
const ED=()=>S.ed.r[S.ed.day];
function ed(i,k,v){ED().ex[i][k]=v}
function mv(i,s){const x=ED().ex,j=i+s;if(j<0||j>=x.length)return;[x[i],x[j]]=[x[j],x[i]];R()}
function rm(i){ED().ex.splice(i,1);R()}
function te(id){const x=D.lib.find(y=>y.id===id),d=ED(),k=d.ex.findIndex(e=>e.n===x.n);if(k>=0)d.ex.splice(k,1);else d.ex.push({n:x.n,s:cur().s,r:x.t==='seg'?45:cur().r,rest:90,t:x.t,note:'',last:'',logs:[]});R()}
function tg(g){const d=ED(),i=d.g.indexOf(g);i>=0?d.g.splice(i,1):d.g.push(g);if(d.auto!==false)d.n=genName(d,S.ed.day);R()}
function addDay(){S.ed.r.push({n:'Día '+(S.ed.r.length+1),comment:'',ex:[],g:[],auto:true});S.ed.day=S.ed.r.length-1;R()}
function saveEd(){const c=cur();c.routine=S.ed.r.map(d=>({n:d.n,comment:d.comment||'',ex:d.ex,wd:d.wd,time:d.time,end:d.end,real:d.real}));c.days=c.routine.length;notify('cl','Carlos actualizó tu rutina',c.id,'rutina');if(c.sch&&c.routine.some(hasSch))notify('cl','Carlos te asignó horario de entrenamiento',c.id,'rutina');S.ed=null;R();toast('Rutina guardada')}
function avV(){const E=S.ed,d=ED(),q=E.q.toLowerCase();return d.g.length?d.g.map(g=>`<div class="sm mut" style="margin-top:8px">${g}</div>`+D.lib.filter(x=>x.g===g&&x.n.toLowerCase().includes(q)).map(x=>`<label style="font-weight:400;display:flex;gap:8px;padding:5px 0"><input type="checkbox" style="width:auto" ${d.ex.some(e=>e.n===x.n)?'checked':''} onchange="te(${x.id})">${x.n}${x.own?' <span class="chip warn">Propio</span>':''}</label>`).join('')).join(''):'<p class="mut">Elige uno o más grupos musculares.</p>'}
const selV=(e,i)=>`<div class="ex" ondragover="event.preventDefault();this.style.background='var(--fill)'" ondragleave="this.style.background=''" ondrop="dp(${i})"><div class="row sp"><div><b><span draggable="true" title="Arrastra para reordenar" aria-label="Arrastrar para reordenar" style="cursor:grab;font-size:18px;padding:0 4px" ondragstart="dg=${i};event.dataTransfer.setDragImage(this.closest('.ex'),10,10)">⠿</span> ${e.n}</b><div class="sm mut">${(D.lib.find(x=>x.n===e.n)||{}).g||''}</div></div><div class="row"><button class="btn s" aria-label="Subir" onclick="mv(${i},-1)">↑</button><button class="btn s" aria-label="Bajar" onclick="mv(${i},1)">↓</button><button class="btn s" aria-label="Quitar" onclick="rm(${i})">✕</button></div></div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(80px,1fr));margin-top:6px">${[['Series','s'],[e.t==='seg'?'Segundos':'Reps','r'],['Descanso (s)','rest']].map(f=>`<div><label class="sm">${f[0]}</label><input type="number" value="${e[f[1]]}" onchange="ed(${i},'${f[1]}',+this.value)"></div>`).join('')}<div><label class="sm">Medida</label><select onchange="ed(${i},'t',this.value);R()"><option value="reps" ${e.t!=='seg'?'selected':''}>Reps</option><option value="seg" ${e.t==='seg'?'selected':''}>Tiempo</option></select></div></div><input style="margin-top:6px" placeholder="Nota (tempo, RPE, técnica)" value="${esc(e.note||'')}" onchange="ed(${i},'note',this.value)"></div>`;
function edV(){const E=S.ed,c=cur(),d=ED();
return `<a href="#" onclick="exitEd();return false" style="color:var(--acc)" class="sm">‹ Volver a ${c.n}</a><div class="row sp"><div><h1>Configurar rutina</h1><div class="mut">${c.n} · elige los grupos musculares de cada día y luego sus ejercicios</div></div><span class="row"><button class="btn" onclick="tplApply()">Aplicar plantilla</button><button class="btn" onclick="tplSave()">Guardar como plantilla</button><button class="btn p" onclick="saveEd()">Guardar rutina</button></span></div>
<div class="tabs">${E.r.map((x,i)=>`<button class="tab ${i===E.day?'on':''}" onclick="S.ed.day=${i};R()">Día ${i+1}</button>`).join('')}<button class="tab" style="color:var(--acc)" onclick="addDay()">+ Día</button></div>
<div class="card"><div class="row sp"><label for="dn">Nombre del día</label>${E.r.length>1?'<button class="btn s" onclick="rmDay()">Quitar este día</button>':''}</div><input id="dn" value="${esc(d.n)}" oninput="ED().n=this.value;ED().auto=this.value.trim()===''"><div style="margin-top:10px">${schSwitch(cur())}</div>${cur().sch?`<div class="row" style="margin-top:10px;align-items:flex-end"><div><label for="sw">Día de la semana</label><select id="sw" style="width:auto" onchange="sch('wd',this.value)"><option value="">Sin horario</option>${WD.map((x,i)=>`<option value="${i}" ${d.wd===i?'selected':''}>${x}</option>`).join('')}</select></div><div><label for="st">Hora de inicio</label><input id="st" type="time" style="width:auto" value="${d.time||''}" onchange="sch('time',this.value)"></div><div><label for="se">Hora de fin</label><input id="se" type="time" style="width:auto" value="${d.end||''}" onchange="sch('end',this.value)"></div><span class="sm mut">Opcional. El cliente lo verá en su rutina.</span></div>`:'<p class="sm mut" style="margin-top:10px">Este cliente no tiene horario asignado: él registrará a qué hora entrena. Actívalo con “Horario asignado” en la ficha del cliente.</p>'}
<div class="sm" style="font-weight:600;margin:10px 0 6px">Grupos musculares de este día (puedes combinar varios)</div><div class="row">${D.groups.map(g=>`<button class="btn s" style="border-radius:99px;${d.g.includes(g)?'background:var(--soft);border-color:var(--acc);color:var(--acc)':''}" onclick="tg('${g}')">${d.g.includes(g)?'✓ ':''}${g}</button>`).join('')}</div></div>
<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:start"><div class="card"><h2>Ejercicios disponibles</h2><input placeholder="Buscar ejercicio…" aria-label="Buscar ejercicio" value="${esc(E.q)}" oninput="S.ed.q=this.value;$('#avl').innerHTML=avV()"><div id="avl">${avV()}</div><button class="btn s" style="margin-top:8px" onclick="exForm(false)">+ Crear ejercicio nuevo</button></div><div class="card"><h2>Ejercicios del día · ${d.ex.length} seleccionados</h2>${d.ex.map((e,i)=>selV(e,i)).join('')||'<p class="mut">Elige un grupo y marca ejercicios para empezar.</p>'}</div></div>`}
// CLIENT
function clientV(){S.cid=1;const c=cur(),t=S.tab==='resumen'?'rutina':S.tab;S.tab=t;
return `<h1>Mi entrenamiento</h1><div class="mut">Tu entrenador: ${D.trainers.find(x=>x.id===c.tid).n} · Plan de ${c.days} días / semana</div>${c.sch&&c.routine.some(hasSch)?`<div class="sm" style="margin-top:4px">Tu horario: ${c.routine.filter(hasSch).sort((a,b)=>a.wd-b.wd).map(d=>WS[d.wd]+' '+d.time+(d.end?'–'+d.end:'')).join(' · ')}</div>`:''}${c.pay!=='ok'?`<div class="banner" style="margin-top:10px">Tu plan vence el ${c.due}</div>`:`<div class="sm mut" style="margin-top:4px">Tu plan vence el ${c.due}</div>`}
<div class="tabs">${[['rutina','Rutina'],['progreso','Mi progreso'],['nutricion','Plan nutricional']].map(x=>`<button class="tab ${t===x[0]?'on':''}" onclick="S.tab='${x[0]}';R()">${x[1]}</button>`).join('')}</div>${t==='rutina'?rutinaV(false):t==='progreso'?progV(c):nutV(false)}`}
R();
</script></body></html>
